name: Tooling CI
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Native tests, formatting, coverage, vet and build
        env:
          LEDGER_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: go run ./cmd/ledger-tool --root . check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tooling-${{ matrix.os }}-evidence
          path: |
            coverage/
            build/governance/
            build/secrets.json
          if-no-files-found: warn
  review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: go run ./cmd/ledger-tool commit-check "$PR_TITLE"
      - name: Independent final-source review
        run: go run ./cmd/ledger-tool review-check --file .governance/review.json
